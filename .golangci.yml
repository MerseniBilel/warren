# Warren quality gate.
#
# This file is the single source of truth for formatting and static analysis.
# `make lint` runs exactly what CI runs; there is no second tool and no second
# config. It is placed at the repository root so that every module in the
# multi-module workspace resolves the same rules.
#
# Principle: enable by default, disable with a stated reason. Every entry under
# `disable` carries a comment explaining itself. A disable without a reason is a
# bug in this file.
version: "2"

run:
  timeout: 5m
  # Paths in exclusions are resolved against the go.mod directory, so this file
  # behaves identically whether invoked from the root or from a submodule.
  relative-path-mode: gomod
  tests: true
  # CI must fail on a stale go.mod rather than silently updating it.
  modules-download-mode: readonly

linters:
  default: all

  disable:
    # --- Conflicts with Warren's design ---
    - ireturn
      # Warren is a ports-and-adapters framework: returning an interface from a
      # constructor is the point, not an accident.
    - err113
      # Mandates sentinel errors everywhere. Warren's error model is semantic
      # codes on a single error type; this linter fights it.
    - wrapcheck
      # Demands wrapping at every external boundary. warren/errors owns wrapping
      # policy, and this produces noise wherever it is correctly delegated.
    - nonamedreturns
      # Named returns are how a deferred function amends an error on the way
      # out, which the lifecycle and unit-of-work code does deliberately.

    # --- Deprecated upstream ---
    - gomodguard
      # Deprecated in golangci-lint v2.12.0, superseded by gomodguard_v2, which
      # `default: all` already enables.

    # --- Redundant with a formatter or another linter ---
    - lll
      # golines enforces line length as a formatter, so it fixes rather than reports.
    - wsl
    - wsl_v5
    - nlreturn
      # Whitespace placement is gofumpt's job. These three disagree with it.

    # --- Too noisy to be useful at this stage ---
    - exhaustruct
      # Requires every struct field at every literal. Unusable with config
      # structs that exist precisely to have defaults.
    - varnamelen
      # Rejects `i`, `db`, `tx`, `ok`. Idiomatic Go, flagged as a problem.
    - godox
      # Flags TODO/FIXME. Pre-1.0 those are a working tool, not debt to gate on.
      # Re-enable at v1.0.
    - tagliatelle
      # Enforces one casing convention for struct tags. Warren must not impose a
      # JSON casing convention on users' DTOs, and our own code follows theirs.

  settings:
    depguard:
      rules:
        # Bans that apply everywhere in the repository.
        global:
          files: ["$all"]
          deny:
            # Warren logs through log/slog and adds context plumbing over it,
            # never a logging framework. See docs/architecture.md §3.
            - pkg: github.com/sirupsen/logrus
              desc: "Warren logs through log/slog. See warren/log."
            - pkg: go.uber.org/zap
              desc: "Warren logs through log/slog. See warren/log."
            - pkg: github.com/rs/zerolog
              desc: "Warren logs through log/slog. See warren/log."
            - pkg: log$
              desc: "The old standard logger has no levels and no structure. Use log/slog through warren/log."
            - pkg: github.com/pkg/errors
              desc: "Use warren/errors, which wraps stdlib errors with semantic codes."
            - pkg: io/ioutil
              desc: "Deprecated. Use os and io."
            - pkg: math/rand$
              desc: "Use math/rand/v2."
            - pkg: github.com/spf13/viper
              desc: "Rejected in docs/architecture.md §3. warren/config uses koanf."

            # warren/di is written in-house and lives in the core module, so
            # no third-party DI container may be imported anywhere. See
            # docs/architecture.md §3. This is an architecture rule that happens to be
            # checkable today, so it runs today rather than waiting for
            # `warren lint arch`.
            - pkg: go.uber.org/dig
              desc: "Warren writes its own container. See docs/architecture.md §3."
            - pkg: go.uber.org/fx
              desc: "Warren owns lifecycle. See docs/architecture.md §3."
            - pkg: github.com/samber/do
              desc: "Warren writes its own container. See docs/architecture.md §3."

    # Replace directives are never committed. They break `go get` for
    # users silently. Cross-module development uses go.work, which is ignored.
    gomoddirectives:
      replace-local: false
      retract-allow-no-explanation: false

    # Every transport must map every semantic error code. A new code
    # that an adapter forgets to handle has to fail the build, not fall through
    # to a 500.
    exhaustive:
      default-signifies-exhaustive: false
      check:
        - switch
        - map

    # A record logged without the context loses the request-scoped attributes
    # warren/log exists to carry, so the ...Context call form is required rather
    # than merely recommended. See log/SPEC.md §8.
    sloglint:
      context: all

    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
        # warren/errors constructors take a printf-style message, so vet must
        # know they are printf wrappers. Without this, NotFound("id %s") with no
        # argument ships a message containing "%!s(MISSING)", and
        # NotFound("...: %w", err) silently produces "%!w" instead of wrapping —
        # the one mistake AGENT.md § Errors names explicitly.
        printf:
          funcs:
            - github.com/MerseniBilel/warren/errors.NotFound
            - github.com/MerseniBilel/warren/errors.Conflict
            - github.com/MerseniBilel/warren/errors.Invalid
            - github.com/MerseniBilel/warren/errors.PermissionDenied
            - github.com/MerseniBilel/warren/errors.Internal
            - (*github.com/MerseniBilel/warren/errors.Error).Fix

    revive:
      rules:
        - name: exported
          # A framework's exported surface is its documentation.
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
        - name: package-comments
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: unexported-return
        - name: var-naming

    gocritic:
      enabled-tags: [diagnostic, style, performance, opinionated]
      disabled-checks:
        - whyNoLint # nolintlint owns this, with a stricter rule.

    cyclop:
      max-complexity: 15
      package-average: 8

    funlen:
      lines: 80
      statements: 50

    dupl:
      threshold: 150

    nolintlint:
      # A bare //nolint is itself a failure.
      require-explanation: true
      require-specific: true
      allow-unused: false

    forbidigo:
      forbid:
        - pattern: "^fmt\\.Print.*$"
          msg: "A library must not write to stdout. Use warren/log."
        - pattern: "^panic$"
          msg: "Return an error. Panic only in a program's own main, never in library code."

    gosec:
      excludes:
        - G115 # Integer conversion overflow: too many false positives on len().

    testifylint:
      enable-all: true

  exclusions:
    # Strict mode follows the official generated-file convention, so a
    # hand-written file living in a gen/ directory is still linted.
    generated: strict
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives

    rules:
      # Table tests repeat themselves by nature, and enforcing DRY in
      # tests makes them harder to read — the opposite of the point.
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gosec
          - errcheck
          - cyclop
          - maintidx
          - containedctx
          - forbidigo
            # A Go Example is verified by comparing what it prints to stdout
            # against its // Output: comment. Printing is the mechanism, so the
            # library-wide ban on fmt.Print cannot apply in tests.

      # Test helpers legitimately take *testing.T and panic-adjacent paths.
      - path: (^|/)testing/
        linters:
          - forbidigo

      # The CLI is a program, not a library: writing to stdout is its job.
      - path: (^|/)cli/
        linters:
          - forbidigo

      # Golden-file fixtures are data. They are not compiled as part of a build,
      # but exclude them explicitly so a stray .go fixture never trips the gate.
      - path: testdata/
        linters:
          - govet
          - revive
          - staticcheck

formatters:
  enable:
    - gofmt
    - gofumpt
    - gci
    - golines

  settings:
    gofumpt:
      extra-rules: true

    gci:
      # Deterministic grouping. This is not cosmetic: Warren's layering rules are
      # about who imports what, so a consistently grouped import block makes a
      # violation visible to a human reviewer before the linter runs.
      sections:
        - standard
        - default
        - prefix(github.com/MerseniBilel/warren)
      custom-order: true

    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false

  exclusions:
    generated: strict

issues:
  # A framework's CI must show every violation, not the first fifty. Truncated
  # output trains people to fix one thing and push again.
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      colors: true
