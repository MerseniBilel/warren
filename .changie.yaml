# Changie configuration. See docs/adr/0005-commits-and-changelog.md.
#
# Every change lands as its own fragment file under .changes/unreleased/, so two
# pull requests never edit the same changelog file and never conflict over it.
# `projects` maps onto the multi-module layout from ADR-0003: each module gets
# its own changelog, because a user of warren/broker/kafka should not have to
# read core's release notes to find theirs.

changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md

# Go requires submodule tags of the form `broker/kafka/v0.3.0`, so the separator
# between a project key and its version is a slash.
projectsVersionSeparator: "/"

# One entry per module. Adding a module means adding it here in the same commit
# that creates its go.mod -- a module with no changelog silently drops its
# release notes into core's.
projects:
  - label: core
    key: core
    changelog: CHANGELOG.md
  - label: cli
    key: cli
    changelog: cli/CHANGELOG.md
  - label: config
    key: config
    changelog: config/CHANGELOG.md
  - label: validate
    key: validate
    changelog: validate/CHANGELOG.md
  - label: transport/http
    key: transport/http
    changelog: transport/http/CHANGELOG.md
  - label: transport/grpc
    key: transport/grpc
    changelog: transport/grpc/CHANGELOG.md
  - label: broker
    key: broker
    changelog: broker/CHANGELOG.md
  - label: broker/kafka
    key: broker/kafka
    changelog: broker/kafka/CHANGELOG.md
  - label: persistence
    key: persistence
    changelog: persistence/CHANGELOG.md
  - label: persistence/postgres
    key: persistence/postgres
    changelog: persistence/postgres/CHANGELOG.md
  - label: observability
    key: observability
    changelog: observability/CHANGELOG.md
  - label: testing
    key: testing
    changelog: testing/CHANGELOG.md
  - label: mcp
    key: mcp
    changelog: mcp/CHANGELOG.md

# Keep-a-Changelog categories. `auto` drives semantic version selection.
#
# NOTE: while Warren is pre-1.0, `breaking` is deliberately `minor`, matching
# Go's semantic import versioning where 0.x minor bumps may break. Change
# `breaking` to `major` at v1.0 -- that switch is part of the 1.0 checklist.
kinds:
  - label: Added
    key: added
    auto: minor
  - label: Changed
    key: changed
    auto: minor
  - label: Deprecated
    key: deprecated
    auto: minor
  - label: Removed
    key: removed
    auto: minor
  - label: Fixed
    key: fixed
    auto: patch
  - label: Security
    key: security
    auto: patch
  - label: Breaking
    key: breaking
    auto: minor

# Prompts shown by `changie new` / `make changelog`.
custom:
  - key: Issue
    label: Issue or PR number (0 if none)
    type: int
    minInt: 0
  - key: Migration
    label: Migration note (required for Breaking; blank otherwise)
    type: string
    minLength: 0

fragmentFileFormat: "{{.Project}}-{{.Kind}}-{{.Time.Format \"20060102-150405\"}}"

versionFormat: "## {{.Version}} — {{.Time.Format \"2006-01-02\"}}"
kindFormat: "### {{.Kind}}"
changeFormat: >-
  * {{.Body}}
  {{- if ne .Custom.Issue "0"}} ([#{{.Custom.Issue}}](https://github.com/MerseniBilel/warren/issues/{{.Custom.Issue}})){{end}}
  {{- if .Custom.Migration}}

    **Migration:** {{.Custom.Migration}}{{end}}

newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
