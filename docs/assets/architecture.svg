7;</text><text fill="#263238" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="46.002" x="2141.29" y="920.2702">openapi</text><text fill="#263238" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="145.4121" x="2141.29" y="932.2702">OpenAPI 3.1 from handlers</text></g><!--entity wtesting--><g class="entity" data-qualified-name="tools.wtesting" data-source-line="124" id="ent0064"><rect fill="#E1BEE7" height="66" rx="4" ry="4" style="stroke:#8E24AA;stroke-width:0.5;" width="144.0664" x="2308.97" y="885.03"/><text fill="#607D8B" font-family="'Helvetica'" font-size="10" font-style="italic" lengthAdjust="spacing" textLength="27.2461" x="2367.3802" y="902.7302">&#171;tool&#187;</text><text fill="#263238" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="39.334" x="2318.97" y="914.2702">testing</text><text fill="#263238" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="124.0664" x="2318.97" y="926.2702">module harness &#183; fakes</text><text fill="#263238" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="82.0254" x="2318.97" y="938.2702">testcontainers</text></g><g class="entity" data-qualified-name="GMN113" data-source-line="160" id="ent0114"><path d="M1196.67,187.03 L1196.67,249.03 A4,4 0 0 0 1200.67,253.03 L1359.3399,253.03 A4,4 0 0 0 1363.3399,249.03 L1363.3399,193.03 L1353.3399,183.03 L1200.67,183.03 A4,4 0 0 0 1196.67,187.03" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1353.3399,183.03 L1353.3399,191.03 A2,2 0 0 0 1355.3399,193.03 L1363.3399,193.03 L1353.3399,183.03" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="145.6699" x="1202.67" y="197.2702">A minimal service's go.mod</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="8.666" x="1202.67" y="209.2702">is</text><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="89.3555" x="1214.67" y="209.2702">one require line</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="3.334" x="1304.0255" y="209.2702">.</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="136.0898" x="1202.67" y="221.2702">Nothing in here can pull a</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="135.4102" x="1202.67" y="233.2702">third-party package into a</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="63.6563" x="1202.67" y="245.2702">user's build.</text></g><g class="entity" data-qualified-name="GMN116" data-source-line="168" id="ent0117"><path d="M494.71,743.03 L494.71,781.03 A4,4 0 0 0 498.71,785.03 L1009.294,785.03 A4,4 0 0 0 1013.294,781.03 L1013.294,749.03 L1003.294,739.03 L498.71,739.03 A4,4 0 0 0 494.71,743.03" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1003.294,739.03 L1003.294,747.03 A2,2 0 0 0 1005.294,749.03 L1013.294,749.03 L1003.294,739.03" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="497.584" x="500.71" y="753.2702">A driver type never reaches a Warren signature &#8212; no *chi.Mux, no *pgx.Conn, no *kgo.Client.</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="468.2754" x="500.71" y="765.2702">The raw client stays reachable through an explicit escape hatch, because an abstraction</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="276.8555" x="500.71" y="777.2702">that cannot be escaped is one users vendor around.</text></g><!--lin