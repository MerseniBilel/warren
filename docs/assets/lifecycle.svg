<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1475px" preserveAspectRatio="none" style="width:770px;height:1475px;background:#FFFFFF;" version="1.1" viewBox="0 0 770 1475" width="770px" zoomAndPan="magnify"><title>Warren lifecycle &#8212; from `go run .` to exit</title><defs/><g><g class="title" data-source-line="189"><text fill="#000000" font-family="'Helvetica'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="269.9307" x="248.8301" y="30.7803">Warren lifecycle &#8212; from `go run .` to exit</text></g><ellipse cx="275.7559" cy="55" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="590" style="stroke:#000000;stroke-width:1.5;" width="493.752" x="146.3555" y="75"/><path d="M319.082,75 L319.082,80 L309.082,90 L146.3555,90" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="25.9863" x="149.3555" y="85.2402">boot</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="133.4063" x="178.6758" y="85.2402">&#8212; nothing is listening yet</text><path d="M353.123,107 L353.123,120 L333.123,124 L353.123,128 L353.123,141 A0,0 0 0 0 353.123,141 L630.1074,141 A0,0 0 0 0 630.1074,141 L630.1074,117 L620.1074,107 L353.123,107 A0,0 0 0 0 353.123,107" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M620.1074,107 L620.1074,117 L630.1074,117 L620.1074,107" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="132.75" x="359.123" y="121.2402">files, then env, then flags</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="255.9844" x="359.123" y="133.2402">an unknown key is an error, with "did you mean"</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="114.7344" x="218.3887" y="108"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="94.7344" x="228.3887" y="127.2402">load configuration</text><path d="M350.1084,160 L350.1084,173 L330.1084,177 L350.1084,181 L350.1084,194 A0,0 0 0 0 350.1084,194 L557.876,194 A0,0 0 0 0 557.876,194 L557.876,170 L547.876,160 L350.1084,160 A0,0 0 0 0 350.1084,160" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M547.876,160 L547.876,170 L557.876,170 L547.876,160" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="186.7676" x="356.1084" y="174.2402">each module contributes providers,</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="141.4102" x="356.1084" y="186.2402">routes, and lifecycle hooks</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="108.7051" x="221.4033" y="161"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="88.7051" x="231.4033" y="180.2402">register modules</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="114.7285" x="218.3916" y="214"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="94.7285" x="228.3916" y="233.2402">build the DI graph</text><path d="M357.1016,259 L357.1016,278 L337.1016,282 L357.1016,286 L357.1016,305 A0,0 0 0 0 357.1016,305 L586.8535,305 A0,0 0 0 0 586.8535,305 L586.8535,269 L576.8535,259 L357.1016,259 A0,0 0 0 0 357.1016,259" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M576.8535,259 L576.8535,269 L586.8535,269 L576.8535,259" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="208.752" x="363.1016" y="273.2402">Missing provider, ambiguity, and cycles</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="39.3516" x="363.1016" y="285.2402">surface</text><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="25.3477" x="405.7871" y="285.2402">here</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="119.3848" x="431.1348" y="285.2402">, never at first request.</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="141.4043" x="363.1016" y="297.2402">Nothing is constructed yet.</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="122.6914" x="214.4102" y="266"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="102.6914" x="224.4102" y="285.2402">validate the graph</text><rect fill="#FFCDD2" height="56" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="154.0801" x="198.7158" y="373"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="134.0801" x="208.7158" y="392.2402">print the resolution chain,</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="98.0625" x="208.7158" y="404.2402">the requesting file,</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="130.084" x="208.7158" y="416.2402">and a copy-pasteable fix</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="89.3691" x="231.0713" y="453"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="69.3691" x="241.0713" y="472.2402">exit non-zero</text><ellipse cx="275.7559" cy="516" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="275.7559" cy="516" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF3E0" points="243.0664,325,308.4453,325,320.4453,337,308.4453,349,243.0664,349,231.0664,337,243.0664,325" style="stroke:#FB8C00;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="279.7559" y="358.2402">no</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="65.3789" x="243.0664" y="340.2402">graph valid?</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="18.6738" x="320.4453" y="334.2402">yes</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="238.8008" x="156.3555" y="569"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="218.8008" x="166.3555" y="588.2402">construct singletons in dependency order</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="136.0742" x="207.7188" y="621"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="116.0742" x="217.7188" y="640.2402">bind ports to adapters</text><rect fill="none" height="138" style="stroke:#000000;stroke-width:1.5;" width="512.5723" x="153.7061" y="675"/><path d="M311.0928,675 L311.0928,680 L301.0928,690 L153.7061,690" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="26.0098" x="156.7061" y="685.2402">start</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="118.043" x="186.0498" y="685.2402">&#8212; ordered, first to last</text><path d="M407.8057,703 L407.8057,722 L387.8057,726 L407.8057,730 L407.8057,749 A0,0 0 0 0 407.8057,749 L656.2783,749 A0,0 0 0 0 656.2783,749 L656.2783,713 L646.2783,703 L407.8057,703 A0,0 0 0 0 407.8057,703" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M646.2783,703 L646.2783,713 L656.2783,713 L646.2783,703" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="227.4727" x="413.8057" y="717.2402">database pool, then broker, then the HTTP</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="223.4297" x="413.8057" y="729.2402">listener &#8212; a consumer never starts before</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="100.7402" x="413.8057" y="741.2402">what it depends on</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="224.0996" x="163.7061" y="710"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="204.0996" x="173.7061" y="729.2402">run OnStart hooks in registration order</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="145.4023" x="203.0547" y="769"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="90.0469" x="213.0547" y="788.2402">readiness flips to</text><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="32.0215" x="306.4355" y="788.2402">ready</text><rect fill="none" height="128" style="stroke:#000000;stroke-width:1.5;" width="748.5908" x="11" y="823"/><path d="M63.6855,823 L63.6855,828 L53.6855,838 L11,838" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="42.6855" x="14" y="833.2402">serving</text><path d="M558.499,868 L558.499,926 L749.5908,926 L749.5908,878 L739.5908,868 L558.499,868" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M739.5908,868 L739.5908,878 L749.5908,878 L739.5908,868" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="146.7422" x="564.499" y="882.2402">Every path enters the same</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="170.0918" x="564.499" y="894.2402">Handler[Req, Res]. The adapter</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="156.75" x="564.499" y="906.2402">owns status codes, acks, and</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="168.7617" x="564.499" y="918.2402">retries. The handler owns none.</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="517.499" x="21" y="855"/><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="100.6895" x="33" y="881"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="80.6895" x="43" y="900.2402">HTTP requests</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="79.3496" x="155.7021" y="881"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="59.3496" x="165.7021" y="900.2402">gRPC calls</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="133.3906" x="263.0518" y="881"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="113.3906" x="273.0518" y="900.2402">consumed messages</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="100.0566" x="424.4424" y="881"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="80.0566" x="434.4424" y="900.2402">scheduled jobs</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="517.499" x="21" y="933"/><rect fill="none" height="461" style="stroke:#000000;stroke-width:1.5;" width="485.2148" x="129.6768" y="961"/><path d="M369.0654,961 L369.0654,966 L359.0654,976 L129.6768,976" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="56.6543" x="132.6768" y="971.2402">shutdown</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="169.4004" x="192.665" y="971.2402">&#8212; drain first, then reverse order</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="124.6719" x="213.4199" y="993"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="104.6719" x="223.4199" y="1012.2402">SIGTERM / SIGINT</text><path d="M370.1123,1044 L370.1123,1057 L350.1123,1061 L370.1123,1065 L370.1123,1078 A0,0 0 0 0 370.1123,1078 L555.2217,1078 A0,0 0 0 0 555.2217,1078 L555.2217,1054 L545.2217,1044 L370.1123,1044 A0,0 0 0 0 370.1123,1044" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M545.2217,1044 L545.2217,1054 L555.2217,1054 L545.2217,1044" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="164.1094" x="376.1123" y="1058.2402">the load balancer stops routing</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="133.4063" x="376.1123" y="1070.2402">before the listener closes</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="148.7129" x="201.3994" y="1045"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="90.0469" x="211.3994" y="1064.2402">readiness flips to</text><text fill="#000000" font-family="'Helvetica'" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="35.332" x="304.7803" y="1064.2402">failing</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="151.4023" x="200.0547" y="1098"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="131.4023" x="210.0547" y="1117.2402">stop accepting new work</text><path d="M339.7754,1149 L339.7754,1162 L319.7754,1166 L339.7754,1170 L339.7754,1183 A0,0 0 0 0 339.7754,1183 L526.8535,1183 A0,0 0 0 0 526.8535,1183 L526.8535,1159 L516.8535,1149 L339.7754,1149 A0,0 0 0 0 339.7754,1149" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><path d="M516.8535,1149 L516.8535,1159 L526.8535,1159 L516.8535,1149" fill="#FFFDE7" style="stroke:#FBC02D;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="166.0781" x="345.7754" y="1163.2402">open HTTP requests complete,</text><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="155.3906" x="345.7754" y="1175.2402">consumers finish and commit</text><rect fill="#E3F2FD" height="32" rx="12.5" ry="12.5" style="stroke:#1976D2;stroke-width:0.5;" width="88.0391" x="231.7363" y="1150"/><text fill="#000000" font-family="'Helvetica'" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="241.7363" y="1169.2402">drain in flight</text><path d="M399.1514,1196 L399.1514,1215 L379.1514,1219 L399.1514,1223 L399.1514,1242 A0,0 0 0 0 399.1514,1242 L604.8916,1242 A0,0 0 0 0 604.8916,1242 L604.8916,1206 L594.8916,1196 L399.1514,1196 A0,0 0 0 0 399.1514,1196" 