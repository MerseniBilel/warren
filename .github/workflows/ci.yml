# Warren CI.
#
# The contract: `make ci` locally runs the same gates as this workflow. When
# they diverge, that is a bug in the Makefile, not a fact of life -- a
# contributor who cannot reproduce a CI failure locally stops trusting CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ADR-0007: Warren tracks the current Go major release.
  GO_VERSION: "1.26"
  GOLANGCI_VERSION: "v2.12.2"
  GOTOOLCHAIN: local # Fail loudly on a version mismatch instead of downloading one.

jobs:
  # Enumerate modules once so every downstream job fans out over the real set
  # rather than a hand-maintained list that drifts (ADR-0003).
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          modules=$(find . -name go.mod -not -path './.git/*' -not -path '*/testdata/*' \
            -exec dirname {} \; | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Discovered: $modules"

  module-rules:
    name: Module rules (ADR-0001/0003/0007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-module-rules.sh

  lint:
    name: Lint (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # Installed directly rather than through golangci-lint-action, because the
      # action always invokes `golangci-lint run` and appends `args` to it --
      # so `args: config verify` becomes `run ... config verify`, and the
      # subcommand names get parsed as directories to lint. Installing the
      # binary also makes CI run the same commands `make lint` runs, which is
      # the contract stated at the top of the Makefile.
      - name: Install golangci-lint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify lint config has not rotted
        run: golangci-lint config verify

      - name: Lint
        working-directory: ${{ matrix.module }}
        run: golangci-lint run

      - name: Check formatting
        working-directory: ${{ matrix.module }}
        run: golangci-lint fmt --diff

  test:
    name: Test (${{ matrix.module }}, go${{ matrix.go }}, ${{ matrix.os }})
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
        go: ["1.26"]
        os: [ubuntu-latest]
        include:
          # Generators write files and golden tests compare bytes, so path
          # separators and line endings must be exercised on Windows and macOS
          # rather than assumed. Core module only, to keep the matrix honest.
          - module: "."
            go: "1.26"
            os: macos-latest
          - module: "."
            go: "1.26"
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # `shell: bash` on every step below is required, not stylistic. Windows
      # runners default to PowerShell, which splits `-coverprofile=coverage.txt`
      # at the `=` and hands `.txt` to the go tool as a package path. Pinning
      # the shell keeps one command working identically on all three OSes.
      - name: Verify go.mod is tidy
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod/go.sum not tidy in ${{ matrix.module }}. Run 'make tidy'."
            exit 1
          }

      - name: Build
        working-directory: ${{ matrix.module }}
        shell: bash
        run: go build ./...

      # -shuffle=on catches tests that depend on execution order, which is the
      # failure that only ever reproduces in CI.
      - name: Unit tests
        working-directory: ${{ matrix.module }}
        shell: bash
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.txt ./...

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage.txt
          if-no-files-found: ignore

  # Go's next release is tested but never blocks a merge. This is what makes
  # ADR-0007's "raise the floor within one minor release" achievable rather than
  # aspirational -- breakage shows up before the release, not after.
  test-next-go:
    name: Test on next Go (advisory)
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
          check-latest: true
      - run: go version
      - run: go test ./...

  integration:
    name: Integration tests
    needs: discover
    runs-on: ubuntu-latest
    # Docker-backed and slow. Not run on every push to a draft PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run integration suite
        run: |
          for m in $(find . -name go.mod -not -path './.git/*' -exec dirname {} \;); do
            echo "==> integration $m"
            (cd "$m" && go test -race -tags=integration -timeout=15m ./...)
          done

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: |
          for m in $(find . -name go.mod -not -path './.git/*' -exec dirname {} \;); do
            echo "==> vuln $m"
            (cd "$m" && govulncheck ./...)
          done

  commits:
    name: Commit and changelog conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Conventional Commits (ADR-0005)
        run: ./scripts/check-commits.sh "origin/${{ github.base_ref }}"
      - name: Changelog fragment present (ADR-0005)
        run: ./scripts/check-changelog.sh "origin/${{ github.base_ref }}"

  # A single required status check, so branch protection does not need updating
  # every time the module matrix changes.
  ci-ok:
    name: CI
    if: always()
    needs: [module-rules, lint, test, vuln]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Upstream results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job did not succeed"; exit 1; }
          done
          echo "All required jobs succeeded."
